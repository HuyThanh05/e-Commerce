# Local development database. Data is stored in sb-ecom/data and survives restarts.
spring.datasource.url=jdbc:h2:file:./data/ecommerce-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Local HTTP is not secure, so authentication cookies must not require HTTPS.
spring.ecom.app.jwtCookieSecure=false

# Development-only defaults. Real integrations still use environment variables.
spring.app.jwtSecret=${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC10aGF0LWlzLWxvbmc=}
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_not_configured}

# Optional local database console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
