# Application
spring.application.name=sb-ecom

# AWS RDS MySQL Database
spring.datasource.url=jdbc:mysql://myapplication1.c5qyo62oyeks.ap-southeast-1.rds.amazonaws.com:3396/ecommerce
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# image storage
project.image=images/

# JWT Configuration
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3000000
spring.ecom.app.jwtCookieName=springBootEcom
spring.ecom.app.jwtCookieSecure=${JWT_COOKIE_SECURE:true}

# Server port (used when deploying to AWS Elastic Beanstalk)
server.port=5000

# # Frontend URL
frontend.url=http://localhost:5173/
# # Base URL for uploaded images
image.base.url=http://localhost:5000/images

# Cloudinary (keep credentials in environment variables)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Stripe Payment
stripe.secret.key=${STRIPE_SECRET_KEY}
